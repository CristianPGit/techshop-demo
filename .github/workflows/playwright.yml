name: TechShop — Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - module2
          - module3
          - module4
          - module5
          - api
          - smoke

jobs:
  # ============================================================
  # MODULE 2 — Locator & Auto-fixing Tests
  # ============================================================
  module2-tests:
    name: 'Module 2 — Locator & Auto-fixing'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'module2' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create results directory
        run: mkdir -p test-results/ai-diff

      - name: Run Module 2 tests
        id: module2
        run: npx playwright test tests/module2.spec.js --reporter=list,json
        env:
          BASE_URL: http://localhost:3000
        continue-on-error: true

      - name: Upload Module 2 test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module2-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      # --------------------------------------------------------
      # AUTO-FIXING AGENT — Triggered when Module 2 tests fail
      # Module 2.3: Claude reads the log and attempts a fix
      # --------------------------------------------------------
      - name: Run Auto-fixing Agent
        if: steps.module2.outcome == 'failure'
        run: node scripts/autofix-agent.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_FIX_ATTEMPTS: 2
          TEST_FILE: tests/module2.spec.js

      - name: Re-run tests after auto-fix
        if: steps.module2.outcome == 'failure'
        id: module2-rerun
        run: npx playwright test tests/module2.spec.js --reporter=list,json
        continue-on-error: true

      # --------------------------------------------------------
      # FALLBACK — Create Jira/Linear task if fix failed
      # Module 2.3.3: Fallback workflow
      # --------------------------------------------------------
      - name: Create bug report on failure
        if: steps.module2.outcome == 'failure' && steps.module2-rerun.outcome == 'failure'
        run: node scripts/create-bug-report.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Fail if tests still broken after fix
        if: steps.module2.outcome == 'failure' && steps.module2-rerun.outcome == 'failure'
        run: exit 1

  # ============================================================
  # MODULE 3 — Visual Validation Tests
  # ============================================================
  module3-visual:
    name: 'Module 3 — Visual Validation'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'module3' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create results directory
        run: mkdir -p test-results/ai-diff

      # --------------------------------------------------------
      # BASELINE: Update snapshots on main branch push
      # --------------------------------------------------------
      - name: Update visual baselines (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx playwright test tests/module3.spec.js --update-snapshots
        continue-on-error: true

      # --------------------------------------------------------
      # REGRESSION: Compare against baselines on PR
      # --------------------------------------------------------
      - name: Run visual regression tests
        id: visual
        run: npx playwright test tests/module3.spec.js --reporter=list,json
        env:
          BASE_URL: http://localhost:3000
        continue-on-error: true

      # --------------------------------------------------------
      # AI DIFF ANALYSIS — Claude compares screenshots
      # Module 3.3: AI-assisted diff analysis
      # --------------------------------------------------------
      - name: Run AI Visual Diff Analysis
        if: steps.visual.outcome == 'failure'
        run: node scripts/ai-visual-diff.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload visual results & AI diff report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module3-visual-results
          path: |
            test-results/
            tests/module3.spec.js-snapshots/
          retention-days: 14

      - name: Fail if visual regressions found
        if: steps.visual.outcome == 'failure'
        run: |
          echo "❌ Visual regressions detected. Check the AI diff report in artifacts."
          exit 1

  # ============================================================
  # SMOKE TESTS — Fast check on every push
  # Runs a subset of critical tests only
  # ============================================================
  smoke:
    name: 'Smoke Tests'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'smoke' || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Start API server
        run: |
          node api/server.js &
          until curl -sf http://localhost:3001/api/health; do sleep 1; done
        env:
          API_PORT: 3001
      - name: Run smoke tests
        run: npx playwright test --grep @smoke --reporter=list
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001

  # ============================================================
  # MODULE 4 — CI Error Logs & Performance Analysis
  # ============================================================
  module4-api:
    name: 'Module 4 — CI Logs & Performance'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'module4' || github.event.inputs.test_suite == 'api' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start API server
        run: |
          node api/server.js &
          until curl -sf http://localhost:3001/api/health; do sleep 1; done
          echo "✅ API ready at http://localhost:3001"
        env:
          API_PORT: 3001

      - name: Run Module 4 tests
        id: module4
        run: npx playwright test tests/module4.spec.js --reporter=list,json
        env:
          API_URL: http://localhost:3001
        continue-on-error: true

      - name: Upload Module 4 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module4-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Fail if Module 4 tests failed
        if: steps.module4.outcome == 'failure'
        run: exit 1

  # ============================================================
  # MODULE 5 — Jira, Page Objects, Swagger DTOs, Test Data
  # ============================================================
  module5-api:
    name: 'Module 5 — Swagger, DTOs & Test Data'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'module5' || github.event.inputs.test_suite == 'api' || github.event_name != 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start API server
        run: |
          node api/server.js &
          until curl -sf http://localhost:3001/api/health; do sleep 1; done
          echo "✅ API ready at http://localhost:3001"
        env:
          API_PORT: 3001

      # Module 5.1.2 tests the UI + API together — static server is handled
      # by Playwright's webServer config in playwright.config.js

      - name: Run Module 5 tests
        id: module5
        run: npx playwright test tests/module5.spec.js --reporter=list,json
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:3001
        continue-on-error: true

      - name: Upload Module 5 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module5-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Fail if Module 5 tests failed
        if: steps.module5.outcome == 'failure'
        run: exit 1
