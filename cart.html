<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — TechShop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar" data-testid="navbar">
    <a href="index.html" class="logo" data-testid="logo">⚡ TechShop</a>
    <div class="nav-links">
      <a href="index.html" data-testid="nav-home">Home</a>
      <a href="products.html" data-testid="nav-products">Products</a>
      <a href="cart.html" data-testid="nav-cart">
        Cart <span class="cart-count" data-testid="cart-count" id="cart-count">0</span>
      </a>
      <a href="login.html" data-testid="nav-login">Login</a>
    </div>
  </nav>

  <section class="section" data-testid="cart-section">
    <h1 class="section-title" data-testid="cart-title">Your Cart</h1>

    <div class="cart-layout">
      <div class="cart-items" data-testid="cart-items" id="cart-items">
        <!-- Populated by JS -->
      </div>

      <div class="cart-summary" data-testid="cart-summary">
        <h3 data-testid="summary-title">Order Summary</h3>
        <div class="summary-row">
          <span>Subtotal</span>
          <span data-testid="subtotal" id="subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span data-testid="shipping" id="shipping">$0.00</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span>
          <span data-testid="total" id="total">$0.00</span>
        </div>
        <a href="checkout.html" class="btn btn-primary btn-full" data-testid="checkout-btn" id="checkout-btn">
          Proceed to Checkout
        </a>
        <a href="products.html" class="btn btn-outline btn-full" data-testid="continue-shopping">
          Continue Shopping
        </a>
      </div>
    </div>
  </section>

  <footer class="footer" data-testid="footer">
    <p data-testid="footer-text">© 2026 TechShop Demo — Built for AI for QA Course</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/bugs.js"></script>
  <script>
    renderCart();
    updateCartCount();
  </script>
</body>
</html>
