<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechShop — Demo Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" data-testid="navbar">
    <a href="index.html" class="logo" data-testid="logo">⚡ TechShop</a>
    <div class="nav-links">
      <a href="index.html" data-testid="nav-home">Home</a>
      <a href="products.html" data-testid="nav-products">Products</a>
      <a href="cart.html" data-testid="nav-cart">
        Cart <span class="cart-count" data-testid="cart-count" id="cart-count">0</span>
      </a>
      <a href="login.html" data-testid="nav-login">Login</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero" data-testid="hero">
    <h1 class="hero-title" data-testid="hero-title">Next-Gen Tech, Delivered Fast</h1>
    <p class="hero-subtitle" data-testid="hero-subtitle">Premium gadgets for modern living</p>
    <a href="products.html" class="btn btn-primary" data-testid="hero-cta">Shop Now</a>
  </section>

  <!-- FEATURED PRODUCTS -->
  <section class="section" data-testid="featured-section">
    <h2 class="section-title" data-testid="section-title">Featured Products</h2>
    <div class="product-grid" data-testid="product-grid" id="featured-grid"></div>
  </section>

  <!-- BANNER -->
  <section class="promo-banner" data-testid="promo-banner">
    <h2 data-testid="promo-title">Free Shipping on Orders Over $50</h2>
    <p data-testid="promo-text">Use code <strong>TECHSHOP10</strong> for 10% off your first order</p>
    <a href="products.html" class="btn btn-outline" data-testid="promo-cta">Browse All Products</a>
  </section>

  <!-- FOOTER -->
  <footer class="footer" data-testid="footer">
    <p data-testid="footer-text">© 2026 TechShop Demo — Built for AI for QA Course</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/bugs.js"></script>
  <script>
    // Render featured products (first 4)
    const grid = document.getElementById('featured-grid');
    const featured = PRODUCTS.slice(0, 4);
    featured.forEach(p => {
      grid.innerHTML += renderProductCard(p);
    });
    updateCartCount();
  </script>
</body>
</html>
