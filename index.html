<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechShop — Demo Store</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar" data-testid="navbar">
    <a href="index.html" class="logo" data-testid="logo">⚡ TechShop</a>
    <div class="nav-links">
      <a href="index.html" data-testid="nav-home">Home</a>
      <a href="products.html" data-testid="nav-products">Products</a>
      <a href="cart.html" data-testid="nav-cart">
        Cart <span class="cart-count" id="cart-count" data-testid="cart-count">0</span>
      </a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <section class="hero" data-testid="hero">
    <h1 class="hero-title" data-testid="hero-title">Next-Gen Tech, Delivered Fast</h1>
    <p class="hero-subtitle">Premium gadgets for modern living</p>
    <a href="products.html" class="btn btn-primary" data-testid="hero-cta">Shop Now</a>
  </section>

  <section class="section">
    <h2 class="section-title">Featured Products</h2>
    <div class="product-grid" id="featured-grid" data-testid="featured-grid"></div>
  </section>

  <section class="promo-banner">
    <h2>Free Shipping on Orders Over $50</h2>
    <p>Use code <strong>TECHSHOP10</strong> for 10% off your first order</p>
    <a href="products.html" class="btn btn-outline">Browse All Products</a>
  </section>

  <footer class="footer">
    <p>© 2026 TechShop</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/bugs.js"></script>
  <script>
    const grid = document.getElementById('featured-grid');
    PRODUCTS.slice(0, 4).forEach(p => { grid.innerHTML += renderProductCard(p); });
    updateCartCount();
  </script>
</body>
</html>
