<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — TechShop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar" data-testid="navbar">
    <a href="index.html" class="logo" data-testid="logo">⚡ TechShop</a>
    <div class="nav-links">
      <a href="index.html" data-testid="nav-home">Home</a>
      <a href="products.html" data-testid="nav-products">Products</a>
      <a href="cart.html" data-testid="nav-cart">
        Cart <span class="cart-count" data-testid="cart-count" id="cart-count">0</span>
      </a>
      <a href="login.html" data-testid="nav-login">Login</a>
    </div>
  </nav>

  <section class="section" data-testid="checkout-section">
    <h1 class="section-title" data-testid="checkout-title">Checkout</h1>

    <div class="checkout-layout">

      <!-- FORM -->
      <form class="checkout-form" data-testid="checkout-form" id="checkout-form" onsubmit="submitOrder(event)">

        <div class="form-group" data-testid="contact-group">
          <h3 data-testid="contact-title">Contact Information</h3>
          <input type="text" class="form-input" data-testid="input-name" id="input-name"
            placeholder="Full Name" required />
          <input type="email" class="form-input" data-testid="input-email" id="input-email"
            placeholder="Email Address" required />
          <input type="tel" class="form-input" data-testid="input-phone" id="input-phone"
            placeholder="Phone Number" />
        </div>

        <div class="form-group" data-testid="shipping-group">
          <h3 data-testid="shipping-title">Shipping Address</h3>
          <input type="text" class="form-input" data-testid="input-address" id="input-address"
            placeholder="Street Address" required />
          <div class="form-row">
            <input type="text" class="form-input" data-testid="input-city" id="input-city"
              placeholder="City" required />
            <input type="text" class="form-input" data-testid="input-zip" id="input-zip"
              placeholder="ZIP Code" required />
          </div>
          <select class="form-input" data-testid="input-country" id="input-country">
            <option value="">Select Country</option>
            <option value="ro">Romania</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="de">Germany</option>
          </select>
        </div>

        <div class="form-group" data-testid="payment-group">
          <h3 data-testid="payment-title">Payment</h3>
          <input type="text" class="form-input" data-testid="input-card" id="input-card"
            placeholder="Card Number (demo: any 16 digits)" maxlength="19" />
          <div class="form-row">
            <input type="text" class="form-input" data-testid="input-expiry" id="input-expiry"
              placeholder="MM/YY" maxlength="5" />
            <input type="text" class="form-input" data-testid="input-cvv" id="input-cvv"
              placeholder="CVV" maxlength="3" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" data-testid="place-order-btn">
          Place Order
        </button>
      </form>

      <!-- ORDER SUMMARY -->
      <div class="cart-summary" data-testid="order-summary">
        <h3 data-testid="summary-title">Order Summary</h3>
        <div id="order-items" data-testid="order-items"></div>
        <div class="summary-row">
          <span>Subtotal</span><span data-testid="subtotal" id="subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span><span data-testid="shipping" id="shipping">$0.00</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span><span data-testid="total" id="total">$0.00</span>
        </div>
      </div>
    </div>

    <!-- SUCCESS MESSAGE (hidden) -->
    <div class="order-success" data-testid="order-success" id="order-success" style="display:none">
      <div class="success-icon">✅</div>
      <h2 data-testid="success-title">Order Placed Successfully!</h2>
      <p data-testid="success-message">Thank you! Your order has been received.</p>
      <p data-testid="order-number">Order #<span id="order-num"></span></p>
      <a href="index.html" class="btn btn-primary" data-testid="back-home">Back to Home</a>
    </div>
  </section>

  <footer class="footer" data-testid="footer">
    <p data-testid="footer-text">© 2026 TechShop Demo — Built for AI for QA Course</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/bugs.js"></script>
  <script>
    function submitOrder(e) {
      e.preventDefault();
      document.getElementById('checkout-form').style.display = 'none';
      document.querySelector('.cart-summary').style.display = 'none';
      const success = document.getElementById('order-success');
      success.style.display = 'flex';
      document.getElementById('order-num').textContent = Math.floor(Math.random() * 90000 + 10000);
      localStorage.removeItem('cart');
      updateCartCount();
    }
    renderCheckoutSummary();
    updateCartCount();
  </script>
</body>
</html>
