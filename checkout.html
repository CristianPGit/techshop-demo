<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — TechShop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar" data-testid="navbar">
    <a href="index.html" class="logo" data-testid="logo">⚡ TechShop</a>
    <div class="nav-links">
      <a href="index.html" data-testid="nav-home">Home</a>
      <a href="products.html" data-testid="nav-products">Products</a>
      <a href="cart.html" data-testid="nav-cart">
        Cart <span class="cart-count" id="cart-count" data-testid="cart-count">0</span>
      </a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <section class="section">
    <h1 class="section-title">Checkout</h1>

    <div class="checkout-layout">

      <form class="checkout-form" id="checkout-form" data-testid="checkout-form" onsubmit="submitOrder(event)">

        <div class="form-group">
          <h3>Contact Information</h3>
          <input type="text" class="form-input" id="input-name" data-testid="input-name" placeholder="Full Name" required />
          <input type="email" class="form-input" id="input-email" data-testid="input-email" placeholder="Email Address" required />
          <input type="tel" class="form-input" id="input-phone" data-testid="input-phone" placeholder="Phone Number" />
        </div>

        <div class="form-group">
          <h3>Shipping Address</h3>
          <input type="text" class="form-input" id="input-address" data-testid="input-address" placeholder="Street Address" required />
          <div class="form-row">
            <input type="text" class="form-input" id="input-city" data-testid="input-city" placeholder="City" required />
            <input type="text" class="form-input" id="input-zip" data-testid="input-zip" placeholder="ZIP Code" required />
          </div>
          <select class="form-input" id="input-country" data-testid="input-country">
            <option value="">Select Country</option>
            <option value="ro">Romania</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="de">Germany</option>
          </select>
        </div>

        <div class="form-group">
          <h3>Payment</h3>
          <input type="text" class="form-input" id="input-card"
            placeholder="Card Number (demo: any 16 digits)" maxlength="19" />
          <div class="form-row">
            <input type="text" class="form-input" id="input-expiry" placeholder="MM/YY" maxlength="5" />
            <input type="text" class="form-input" id="input-cvv" placeholder="CVV" maxlength="3" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" data-testid="place-order-btn">Place Order</button>
      </form>

      <div class="cart-summary" data-testid="cart-summary">
        <h3>Order Summary</h3>
        <div id="order-items"></div>
        <div class="summary-row">
          <span>Subtotal</span><span id="subtotal" data-testid="subtotal">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span><span id="shipping" data-testid="shipping">$0.00</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total</span><span id="total" data-testid="total">$0.00</span>
        </div>
      </div>
    </div>

    <div class="order-success" id="order-success" data-testid="order-success" style="display:none">
      <div class="success-icon">✅</div>
      <h2>Order Placed Successfully!</h2>
      <p>Thank you! Your order has been received.</p>
      <p>Order #<span id="order-num"></span></p>
      <a href="index.html" class="btn btn-primary" data-testid="back-home">Back to Home</a>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 TechShop</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/bugs.js"></script>
  <script>
    function submitOrder(e) {
      e.preventDefault();
      document.getElementById('checkout-form').style.display = 'none';
      document.querySelector('.cart-summary').style.display = 'none';
      const success = document.getElementById('order-success');
      success.style.display = 'flex';
      document.getElementById('order-num').textContent = Math.floor(Math.random() * 90000 + 10000);
      localStorage.removeItem('cart');
      updateCartCount();
    }
    renderCheckoutSummary();
    updateCartCount();
  </script>
</body>
</html>
